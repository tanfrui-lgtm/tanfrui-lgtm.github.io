<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rui Tang · New address / 主页已迁移</title>
  <link rel="canonical" href="https://tangrui-web.github.io/honors.html">
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#20252b;background:#f5f5f0}
    body{max-width:680px;margin:12vh auto;padding:0 24px;line-height:1.7}
    h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:0 0 28px}
    p{margin:14px 0}a{color:#234bd8;text-underline-offset:4px;overflow-wrap:anywhere}
    .action{display:inline-block;margin:12px 0;padding:10px 17px;background:#234bd8;color:white;text-decoration:none;border-radius:4px}
    a:focus-visible{outline:3px solid #234bd8;outline-offset:5px}
    .address{font-size:14px;color:#58616b}noscript{display:block;margin-top:20px}
  </style>
</head>
<body>
  <main>
    <h1>Rui Tang <span lang="zh-CN">唐睿</span></h1>
    <p>My website has moved to a new address.</p>
    <p lang="zh-CN">个人网站已迁移，欢迎访问新地址。</p>
    <a class="action" data-destination href="https://tangrui-web.github.io/honors.html">Continue to the new site <span lang="zh-CN">／ 前往新网站</span></a>
    <p class="address"><a id="destination-url" data-destination href="https://tangrui-web.github.io/honors.html">https://tangrui-web.github.io/honors.html</a></p>
    <noscript><p>JavaScript is disabled. Please use the link above.<br><span lang="zh-CN">当前未启用 JavaScript，请点击上方链接。</span></p></noscript>
  </main>
  <script>
    (() => {
      const target = new URL('https://tangrui-web.github.io/honors.html');
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        target.pathname = location.pathname;
      }
      target.search = location.search;
      target.hash = location.hash;
      document.querySelectorAll('[data-destination]').forEach(link => { link.href = target.href; });
      document.getElementById('destination-url').textContent = target.href;
      const canonicalPath = target.pathname === '/index.html' ? '/' : target.pathname;
      document.querySelector('link[rel="canonical"]').href = target.origin + canonicalPath;
      const legacyOrLocal = ['tanfrui-lgtm.github.io', 'localhost', '127.0.0.1', '[::1]'];
      if (legacyOrLocal.includes(location.hostname)) location.replace(target.href);
    })();
  </script>
</body>
</html>
